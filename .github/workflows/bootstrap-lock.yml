# One-time bootstrap, triggered only when this file is added.
# This workflow is removed after package-lock.json is committed.
name: Generate npm lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Generate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "chore: commit Node 24 npm lockfile"
            git push origin HEAD:main
          fi
